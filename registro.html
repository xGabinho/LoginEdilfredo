<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <h2>Crear una Cuenta</h2>
        
        <form id="register-form">
            <div class="input-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" required placeholder="tu@email.com">
            </div>
            <div class="input-group">
                <label for="password">Contraseña (Mínimo 6 caracteres)</label>
                <input type="password" id="password" required placeholder="******" minlength="6">
            </div>
            <button type="submit" id="btn-register">Registrarse</button>
        </form>

        <p class="toggle-text">
            ¿Ya tienes cuenta? <a href="index.html">Inicia sesión aquí</a>
        </p>

        <div id="message"></div>
    </div>

    <script>
        // PEGA AQUÍ TU URL Y TU KEY DE SUPABASE (Las mismas que en el index)
        const SUPABASE_URL = 'https://TU_PROYECTO.supabase.co';
        const SUPABASE_KEY = 'TU_ANON_KEY_PUBLICA';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const registerForm = document.getElementById('register-form');
        const messageDiv = document.getElementById('message');
        const btnRegister = document.getElementById('btn-register');

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            btnRegister.disabled = true;
            btnRegister.textContent = 'Registrando...';
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Petición a Supabase para Registrar
            const { data, error } = await supabase.auth.signUp({
                email: email,
                password: password
            });

            if (error) {
                messageDiv.textContent = 'Error: ' + error.message;
                messageDiv.className = 'error';
            } else {
                messageDiv.textContent = '¡Registro exitoso! Ya puedes ir a Iniciar Sesión.';
                messageDiv.className = 'success';
                console.log("Usuario logueado:", data.user);
                window.location.href = "index.html";
                registerForm.reset();
            }
            
            btnRegister.disabled = false;
            btnRegister.textContent = 'Registrarse';
        });
    </script>
</body>
</html>
