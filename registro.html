<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <h2>Crear Cuenta</h2>
        <form id="register-form">
            <div class="input-group">
                <label>Correo Electrónico</label>
                <input type="email" id="email" required placeholder="ejemplo@correo.com">
            </div>
            <div class="input-group">
                <label>Contraseña (mín. 6 caracteres)</label>
                <input type="password" id="password" required placeholder="******" minlength="6">
            </div>
            <button type="submit" id="btn-register">Registrarse</button>
        </form>
        <p class="toggle-text">¿Ya tienes cuenta? <a href="index.html">Inicia sesión aquí</a></p>
        <div id="message"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://smpinwhinltoozbvymvu.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_K1kfid4VYAMB8V8irrYs5w_GAuwdpt0'; // Reemplaza con tu llave pública (anon)
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const registerForm = document.getElementById('register-form');
        const messageDiv = document.getElementById('message');
        const btnRegister = document.getElementById('btn-register');

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            btnRegister.disabled = true;
            btnRegister.textContent = 'Procesando...';
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await supabase.auth.signUp({ email, password });

            if (error) {
                messageDiv.textContent = error.message;
                messageDiv.className = 'error';
            } else {
                messageDiv.textContent = '¡Cuenta creada! Ya puedes iniciar sesión.';
                messageDiv.className = 'success';
                registerForm.reset();
            }
            btnRegister.disabled = false;
            btnRegister.textContent = 'Registrarse';
        });
    </script>
</body>
</html>
