<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Usuario</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <h2>Panel de Control</h2>
        <div id="user-info">
            <p>Usuario activo:</p>
            <strong id="user-email">Verificando sesión...</strong>
        </div>
        <p>Has accedido correctamente a la zona privada.</p>
        <button id="btn-logout" style="background-color: #dc3545; margin-top: 1rem;">Cerrar Sesión</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://smpinwhinltoozbvymvu.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_K1kfid4VYAMB8V8irrYs5w_GAuwdpt0'; // Reemplaza con tu llave pública (anon)
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const userEmailSpan = document.getElementById('user-email');
        const btnLogout = document.getElementById('btn-logout');

        async function checkUser() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = "index.html";
            } else {
                userEmailSpan.textContent = session.user.email;
            }
        }

        btnLogout.addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.href = "index.html";
        });

        checkUser();
    </script>
</body>
</html>
