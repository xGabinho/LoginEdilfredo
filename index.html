<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <h2>Iniciar Sesión</h2>
        
        <form id="login-form">
            <div class="input-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" required placeholder="tu@email.com">
            </div>
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="******">
            </div>
            <button type="submit" id="btn-login">Entrar</button>
        </form>

        <p class="toggle-text">
            ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
        </p>

        <div id="message"></div>
    </div>

    <script>
        // PEGA AQUÍ TU URL Y TU KEY DE SUPABASE
        const SUPABASE_URL = 'https://smpinwhinltoozbvymvu.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_K1kfid4VYAMB8V8irrYs5w_GAuwdpt0';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const loginForm = document.getElementById('login-form');
        const messageDiv = document.getElementById('message');
        const btnLogin = document.getElementById('btn-login');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            btnLogin.disabled = true;
            btnLogin.textContent = 'Cargando...';
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Petición a Supabase para Iniciar Sesión
            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                messageDiv.textContent = 'Error: ' + error.message;
                messageDiv.className = 'error';
            } else {
                messageDiv.textContent = '¡Inicio de sesión exitoso! Redirigiendo...';
                messageDiv.className = 'success';
                
                // ESTA LÍNEA ES LA IMPORTANTE:
                setTimeout(() => {
                    window.location.href = "panel.html";
                }, 1000); // Espera 1 segundo para que el usuario vea el mensaje y luego redirige
            }
            }
            
            btnLogin.disabled = false;
            btnLogin.textContent = 'Entrar';
        });
    </script>
</body>
</html>
