<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth con Supabase</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <h2 id="form-title">Iniciar Sesión</h2>
        
        <form id="auth-form">
            <div class="input-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" required placeholder="tu@email.com">
            </div>
            
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="******">
            </div>
            
            <button type="submit" id="submit-btn">Entrar</button>
        </form>

        <p class="toggle-text">
            <span id="toggle-msg">¿No tienes cuenta?</span> 
            <a href="#" id="toggle-link">Regístrate aquí</a>
        </p>

        <div id="message"></div>
    </div>

    <div class="container hidden" id="dashboard">
        <h2>¡Bienvenido!</h2>
        <p>Has iniciado sesión correctamente.</p>
        <p>Tu email: <strong id="user-email"></strong></p>
        <button id="logout-btn" style="background-color: #dc3545;">Cerrar Sesión</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
